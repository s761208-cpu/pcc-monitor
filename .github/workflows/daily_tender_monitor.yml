# .github/workflows/daily_tender_monitor.yml
# 每天早上 8:00（台灣時間）自動執行

name: 每日採購標案監控

on:
  schedule:
    # UTC 00:00 = 台灣時間 08:00
    - cron: "0 0 * * *"
  
  # 允許手動在 GitHub 介面點「Run workflow」觸發
  workflow_dispatch:

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 執行標案監控腳本
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO:  ${{ secrets.EMAIL_TO }}
        run: python fetch_tenders.py
